# dsh-session-bot 作为 bundle 时的入口行。
#
# 行名必须跟包名一致：dsh-client-modules 会把包名匹配到的那一行挂上浏览器半边，
# 所以这里也是插件详情页里能改配置的地方。
#
# stateDir 一定要由使用者填：插件不猜目录（写错地方比不写更糟），留空它会拒绝激活。
- insert:
    - id: dsh-session-bot
      name: dsh-session-bot
      config:
        # 状态文件（bots.json / 交接笔记）放这里。
        stateDir: ''
        # 新会话的默认工作目录；BOT 认领时会从会话自身记下 cwd，这里只是兜底。
        workspace: ''
        # 启动时自动认领的 BOT。一般留空，从界面上认领。
        bots: []
